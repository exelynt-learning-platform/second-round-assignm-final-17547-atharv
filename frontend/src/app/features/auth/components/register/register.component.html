<div class="row justify-content-center mt-5">
  <div class="col-md-6 col-lg-4">
    <mat-card>
      <mat-card-header class="justify-content-center mb-3">
        <mat-card-title>Create an Account</mat-card-title>
      </mat-card-header>
      
      <mat-card-content>
        <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
          
          <mat-form-field appearance="outline" class="w-100 mb-2">
            <mat-label>Username</mat-label>
            <input matInput formControlName="username" placeholder="Choose a username" required>
            <mat-error *ngIf="f['username'].errors?.['required']">Username is required</mat-error>
          </mat-form-field>

          <mat-form-field appearance="outline" class="w-100 mb-2">
            <mat-label>Email Address</mat-label>
            <input matInput formControlName="email" type="email" placeholder="Enter your email" required>
            <mat-error *ngIf="f['email'].errors?.['required']">Email is required</mat-error>
            <mat-error *ngIf="f['email'].errors?.['email']">Please enter a valid email</mat-error>
          </mat-form-field>

          <mat-form-field appearance="outline" class="w-100 mb-3">
            <mat-label>Password</mat-label>
            <input matInput type="password" formControlName="password" placeholder="Create a password" required>
            <mat-error *ngIf="f['password'].errors?.['required']">Password is required</mat-error>
            <mat-error *ngIf="f['password'].errors?.['minlength']">Password must be at least 6 characters</mat-error>
          </mat-form-field>

          <button mat-raised-button color="accent" type="submit" [disabled]="registerForm.invalid" class="w-100 py-2">
            Register
          </button>
        </form>
      </mat-card-content>
      
      <mat-card-actions class="justify-content-center mt-2 pb-3">
        <span>Already have an account?</span>
        <a routerLink="/auth/login" mat-button color="primary">Login here</a>
      </mat-card-actions>
    </mat-card>
  </div>
</div>
