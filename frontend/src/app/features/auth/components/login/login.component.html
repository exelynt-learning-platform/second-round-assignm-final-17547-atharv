<div class="row justify-content-center mt-5">
  <div class="col-md-6 col-lg-4">
    <mat-card>
      <mat-card-header class="justify-content-center mb-3">
        <mat-card-title>Login</mat-card-title>
      </mat-card-header>
      
      <mat-card-content>
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
          <mat-form-field appearance="outline" class="w-100 mb-2">
            <mat-label>Username</mat-label>
            <input matInput formControlName="username" placeholder="Enter your username" required>
            <mat-error *ngIf="f['username'].errors?.['required']">Username is required</mat-error>
          </mat-form-field>

          <mat-form-field appearance="outline" class="w-100 mb-3">
            <mat-label>Password</mat-label>
            <input matInput type="password" formControlName="password" placeholder="Enter your password" required>
            <mat-error *ngIf="f['password'].errors?.['required']">Password is required</mat-error>
          </mat-form-field>

          <button mat-raised-button color="primary" type="submit" [disabled]="loginForm.invalid" class="w-100 py-2">
            Login
          </button>
        </form>
      </mat-card-content>
      
      <mat-card-actions class="justify-content-center mt-2 pb-3">
        <span>Don't have an account?</span>
        <a routerLink="/auth/register" mat-button color="accent">Register</a>
      </mat-card-actions>
    </mat-card>
  </div>
</div>
