<div class="row">
  <div class="col-md-4 mb-4" *ngFor="let product of products">
    <mat-card class="h-100 d-flex flex-column">
      <img mat-card-image [src]="product.imageUrl || 'assets/placeholder.png'" alt="Product image" *ngIf="product.imageUrl">
      <mat-card-header>
        <mat-card-title>{{ product.name }}</mat-card-title>
        <mat-card-subtitle>{{ product.price | currency }}</mat-card-subtitle>
      </mat-card-header>
      <mat-card-content class="flex-grow-1 mt-2">
        <p>{{ product.description }}</p>
      </mat-card-content>
      <mat-card-actions>
        <a [routerLink]="['/products/id', product.id]" mat-button color="primary">Details</a>
        <button mat-raised-button color="accent" class="ms-auto">Add to Cart</button>
      </mat-card-actions>
    </mat-card>
  </div>
  
  <div *ngIf="products.length === 0" class="col-12 mt-5 text-center">
    <h3>No products available at the moment.</h3>
  </div>
</div>
